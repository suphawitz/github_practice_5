<body>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">Layer & Less</a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">หน้าแรก</a>
        <a href="menu.html">เมนูเค้ก</a>
        <a class="active" href="contact.html">ติดต่อเรา</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <!-- TODO: Contact Heading -->
        <p class="todo-label">TODO: Contact & Booking Heading</p>

        <div class="contact-grid">
          <!-- TODO: Contact Information + Map -->
          <section class="placeholder-panel">
            TODO: Contact Information + Map
          </section>

          <!-- TODO: Contact Form -->
          <section class="placeholder-panel">
            <h2>ส่งข้อความถึงเรา</h2>

            <form>
              <label>
                ชื่อ
                <input type="text" name="name" placeholder="ชื่อของคุณ">
              </label>

              <label>
                อีเมล
                <input type="email" name="email" placeholder="email@gmail.com">
              </label>

              <label>
                เบอร์โทรศัพท์
                <input type="tel" name="phone" placeholder="0XX-XXX-XXXX">
              </label>

              <label>
                ข้อความ
                <textarea name="message" rows="6" placeholder="สอบถามเรื่องเค้กและสอบถามเพิ่มเติม"></textarea>
              </label>

              <button type="submit">ส่งข้อความ</button>
            </form>
          </section>
        </div>
      </div>
    </section>
  </main>
