<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layer & Less | Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-brown': '#7c624d',
            'brand-pink': '#c25868',
            'brand-dark': '#382828',
            'brand-bg': '#fcfbf9'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-bg text-gray-800 flex flex-col min-h-screen justify-between">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a class="flex items-center gap-2 text-2xl font-bold text-brand-dark" href="index.html">
        <span class="p-2 bg-brand-pink/10 rounded-xl">🎂</span>
        Layer & Less
      </a>

      <nav class="flex items-center gap-2" aria-label="Main navigation">
        <a href="index.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-brand-brown hover:bg-gray-100 transition">หน้าแรก</a>
        <a href="menu.html" class="px-4 py-1.5 rounded-full text-sm font-medium text-brand-brown hover:bg-gray-100 transition">เมนูเค้ก</a>
        <a href="contact.html" class="px-4 py-1.5 rounded-full text-sm font-medium bg-brand-pink text-white hover:bg-brand-pink/90 transition">ติดต่อเรา</a>
      </nav>
    </div>
  </header>

  <main class="mb-auto py-12">
    <section class="max-w-6xl mx-auto px-4">
      
      <!-- Contact Heading -->
      <div class="text-center mb-12">
        <p class="text-brand-pink font-medium text-sm tracking-wider uppercase mb-1">Contact & Booking</p>
        <h1 class="text-3xl md:text-4xl font-bold text-brand-dark">ติดต่อ & จองคิว</h1>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">
        
        <!-- Contact Information + Map -->
        <section class="space-y-8">
          <div class="bg-white p-6 md:p-8 rounded-2xl border border-gray-100 shadow-sm space-y-6">
            <h2 class="text-xl font-bold text-brand-dark mb-4">ข้อมูลร้าน</h2>
            
            <!-- Address -->
            <div class="flex items-start gap-4">
              <div class="p-3 bg-brand-pink/10 text-brand-pink rounded-full shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </div>
              <div>
                <p class="text-sm text-gray-500">ที่อยู่</p>
                <p class="font-medium text-gray-800">123 ถนนสุขุมวิท แขวงคลองตัน เขตคลองเตย กรุงเทพฯ 10110</p>
              </div>
            </div>

            <!-- Phone -->
            <div class="flex items-start gap-4">
              <div class="p-3 bg-brand-pink/10 text-brand-pink rounded-full shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                </svg>
              </div>
              <div>
                <p class="text-sm text-gray-500">เบอร์โทรศัพท์</p>
                <p class="font-medium text-gray-800">02-123-4567 / 098-765-4321</p>
              </div>
            </div>

            <!-- Opening Hours -->
            <div class="flex items-start gap-4">
              <div class="p-3 bg-brand-pink/10 text-brand-pink rounded-full shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <div>
                <p class="text-sm text-gray-500">เวลาทำการ</p>
                <p class="font-medium text-gray-800">ทุกวัน 09:00 - 20:00 น.</p>
              </div>
            </div>

            <!-- Social Media -->
            <div class="pt-2 border-t border-gray-100">
              <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-4 py-2 border border-brand-pink text-brand-pink rounded-full text-sm font-medium hover:bg-brand-pink/5 transition">
                <span>📷</span> Instagram
              </a>
            </div>
          </div>

          <!-- Map Placeholder (Unsplash Image) -->
          <div class="overflow-hidden rounded-2xl border border-gray-100 shadow-sm h-64 bg-gray-200 relative">
            <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80" alt="แผนที่ร้าน Layer & Less" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
              <span class="bg-white/90 text-brand-dark px-4 py-2 rounded-lg text-sm font-semibold shadow-md">📍 ตำแหน่งร้านค้า</span>
            </div>
          </div>
        </section>



</body>
</html>
