<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layer & Less - Bakery Menu</title>
    
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#FDFBF8',      
                            red: '#C24A58',     
                            gold: '#B69E7B',     
                            dark: '#3A2E2B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom underline style for "สั่งล่วงหน้า" */
        .highlight-underline {
            position: relative;
            display: inline-block;
        }
        .highlight-underline::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 2px;
            background-color: #C24A58;
        }
    </style>
</head>
<body class="bg-brand-bg text-brand-dark antialiased">

    <!-- Navigation -->
    <nav class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <!-- Logo Icon -->
            <div class="w-10 h-10 bg-[#8F6A59] text-white rounded-lg flex items-center justify-center text-xl shadow-sm">
                <i class="fa-solid fa-cake-candles"></i>
            </div>
            <!-- Logo Text -->
            <span class="text-2xl font-medium tracking-wide">Layer & Less</span>
        </div>
        
        <!-- Nav Buttons -->
        <div class="hidden md:flex gap-3">
            <a href="#" class="bg-brand-gold hover:bg-opacity-90 text-white px-6 py-1.5 rounded-full text-sm font-medium transition-all shadow-sm">หน้าแรก</a>
            <a href="#" class="bg-brand-red hover:bg-opacity-90 text-white px-6 py-1.5 rounded-full text-sm font-medium transition-all shadow-sm">เมนูเค้ก</a>
            <a href="#" class="bg-brand-gold hover:bg-opacity-90 text-white px-6 py-1.5 rounded-full text-sm font-medium transition-all shadow-sm">ติดต่อเรา</a>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="text-center pt-12 pb-16 px-4">
        <p class="text-brand-red font-medium text-sm mb-3 tracking-widest uppercase">✦ Our Menu ✦</p>
        <h1 class="text-4xl font-semibold mb-4">เมนูเค้กทั้งหมด</h1>
        <p class="text-gray-500 font-light text-lg">
            เค้กทุกชิ้นทำสดใหม่ทุกวัน <span class="highlight-underline text-gray-700 font-normal">สั่งล่วงหน้า</span>เพื่อรับรสชาติที่ดีที่สุด
        </p>
    </header>

    
    <!-- Footer -->
    <footer class="bg-brand-dark text-white pt-12 pb-8">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
                <!-- Footer Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 flex items-center justify-center text-[#C24A58] text-xl">
                        <i class="fa-solid fa-cake-candles"></i>
                    </div>
                    <span class="text-xl font-medium tracking-wide">Layer & Less</span>
                </div>
                
                <!-- Footer Links -->
                <div class="flex gap-6 text-sm text-gray-300 font-light">
                    <a href="#" class="hover:text-white transition-colors">หน้าแรก</a>
                    <a href="#" class="hover:text-white transition-colors">เมนู</a>
                    <a href="#" class="hover:text-white transition-colors">ติดต่อ</a>
                </div>
            </div>
            
            <!-- Divider & Copyright -->
            <div class="border-t border-white/10 pt-8 text-center text-xs text-gray-400 font-light tracking-wide">
                © 2026 La Pâtisserie — ทำด้วยหัวใจทุกชิ้น
            </div>
        </div>
    </footer>

</body>
</html>
